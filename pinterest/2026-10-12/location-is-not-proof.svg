<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500"><rect width="1000" height="1500" fill="#f8f3e9"/><rect width="1000" height="20" fill="#d2a85f"/><text x="70" y="120" fill="#17372f" font-family="DejaVu Sans" font-size="25" font-weight="bold">NEW HOMEOWNER CHECKLIST</text><text x="70" y="260" fill="#17372f" font-family="DejaVu Sans" font-size="62" font-weight="bold">A valve nearby</text><text x="70" y="346" fill="#17372f" font-family="DejaVu Sans" font-size="62" font-weight="bold">is not proof.</text><path d="M820 510h100v90h-100z M840 535h60 M840 555h60 M840 575h35" fill="none" stroke="#d2a85f" stroke-width="5"/><rect x="60" y="650" width="880" height="100" rx="16" fill="white"/><text x="86" y="712" fill="#17372f" font-family="DejaVu Sans" font-size="30">Start at the water entry point</text><rect x="60" y="782" width="880" height="100" rx="16" fill="white"/><text x="86" y="844" fill="#17372f" font-family="DejaVu Sans" font-size="30">Confirm what the valve controls</text><rect x="60" y="914" width="880" height="100" rx="16" fill="white"/><text x="86" y="976" fill="#17372f" font-family="DejaVu Sans" font-size="30">Ask your provider or plumber</text><text x="70" y="1225" fill="#17372f" font-family="DejaVu Sans" font-size="25">Learn the home. Keep useful records.</text><path d="M70 1295h860" stroke="#d2a85f" stroke-width="3"/><text x="70" y="1360" fill="#17372f" font-family="DejaVu Sans" font-size="32" font-weight="bold">HOME ROUTINE GUIDE</text><text x="70" y="1420" fill="#17372f" font-family="DejaVu Sans" font-size="28">homeroutineguide.com</text></svg>